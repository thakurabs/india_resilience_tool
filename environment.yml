name: irt
channels:
  - conda-forge
dependencies:
  # Core runtime
  - python=3.10
  - pip
  - numpy
  - pandas
  - xarray
  - dask
  - matplotlib

  # Geospatial stack (prefer conda-forge for GDAL/GEOS/PROJ compatibility)
  - geopandas
  - rasterio
  - shapely
  - pyproj
  - exactextract

  # Pipeline / analytics
  - scipy
  # Keep Arrow on conda-forge. Do not install/reinstall pyarrow with pip in
  # this environment; mixed pip/conda Arrow DLLs can break Streamlit components.
  - libarrow=21.0.0=*_cpu
  - libarrow-acero=21.0.0=*_cpu
  - libarrow-compute=21.0.0=*_cpu
  - libarrow-dataset=21.0.0=*_cpu
  - libarrow-substrait=21.0.0=*_cpu
  - pyarrow-core=21.0.0=*_cpu
  - pyarrow=21.0.0
  - openpyxl>=3.1

  # Streamlit chart/component dependencies made explicit for dashboard startup
  - altair>=5,<6
  - plotly
  - jsonschema
  - jsonschema-specifications
  - referencing
  - attrs
  - rpds-py

  # Tools retained under tools/
  - boto3
  - fsspec
  - s3fs
  - h5netcdf
  - h5py
  - markdown-it-py
  - mdit-py-plugins
  - tqdm

  # Tests (suite is the safety gate for refactors)
  - pytest

  # Pure-python app deps via pip
  - pip:
      - streamlit==1.51.0
      - streamlit-folium==0.25.3
      - folium==0.20.0
      - climate-indices==2.2.0
