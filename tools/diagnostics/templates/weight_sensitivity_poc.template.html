<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Composite weight sensitivity &mdash; proof of concept</title>
<style>
  /* ============================================================
     The map layer is the IRT target prototype's, ported verbatim in
     look: palette, non-scaling district strokes, floating frosted
     furniture, the .cbar with its range-in-view bracket, and the
     +/-/fit navigation stack. The page around it stays a two-panel
     comparison rather than the three-zone IRT shell -- a left rail
     would cost map width and this page has no geography selector to
     put in one. (CHG-0529)
     ============================================================ */
  :root {
    --ink: #12283d; --ink-2: #3a5570; --ink-3: #7d93a8;
    --rule: #d7e4ef; --panel: #ffffff; --ground: #e9f1f8;
    --head: #123b60;
    --accent: #1560a8; --accent-soft: #e3eefa;
    --warn-bg: #fff6e6; --warn-line: #e8c98a; --warn-ink: #6b4c12;
    --fine: #7a8794;
    --font: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--ground); color: var(--ink);
         font-family: var(--font); font-size: 14px; line-height: 1.5; }
  .wrap { max-width: 1560px; margin: 0 auto; padding: 16px 16px 40px; }

  /* ---------- header strip ---------- */
  header.strip { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px;
                 padding: 10px 16px; margin-bottom: 12px; background: #fff;
                 border: 1px solid var(--rule); border-radius: 8px; }
  header.strip h1 { font-size: 17px; margin: 0; font-weight: 700; color: var(--head);
                    letter-spacing: -0.01em; }
  header.strip .chip { font-size: 11.5px; color: var(--ink-2); background: var(--ground);
                       border: 1px solid var(--rule); border-radius: 999px;
                       padding: 3px 11px; white-space: nowrap; }
  header.strip .chip.parity { color: var(--head); font-weight: 650;
                              background: var(--accent-soft); border-color: #bcd6ef; }
  header.strip .spacer { flex: 1 1 auto; }

  /* ---------- two panels ---------- */
  .panels { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-items: start; }
  @media (max-width: 1080px) { .panels { grid-template-columns: 1fr; } }

  .panel { background: var(--panel); border: 1px solid var(--rule); border-radius: 8px;
           padding: 12px 14px 14px; }
  .panel > h2 { margin: 0 0 2px; font-size: 11.5px; text-transform: uppercase;
                letter-spacing: .05em; color: var(--ink-3); font-weight: 650; }
  .panel .headline { font-size: 17px; font-weight: 650; color: var(--head);
                     letter-spacing: -0.01em; margin: 0 0 2px; }
  .panel .sub { font-size: 12.5px; color: var(--ink-3); margin: 0 0 10px; line-height: 1.4; }

  /* ---------- map ----------
     The wrap is the map's aperture: the furniture floats inside it and
     nothing ever sits outside the thing it describes. */
  .mapwrap { position: relative; overflow: hidden; background: var(--ground);
             border: 1px solid var(--rule); border-radius: 8px; max-height: 68vh; }
  svg.map { display: block; width: 100%; height: 100%; cursor: grab; }
  svg.map:focus-visible { outline: 2px solid var(--accent); outline-offset: -3px; }
  .mapwrap.panning svg.map, .mapwrap.panning svg.map path { cursor: grabbing; }
  svg.map path { vector-effect: non-scaling-stroke; }
  .dist { stroke: var(--fine); stroke-opacity: .45; stroke-width: .45px; cursor: pointer; }
  .dist.hl { stroke: #2b3947; stroke-opacity: .9; stroke-width: 1.1px; }

  /* ---------- floating furniture: ONE recede rule ----------
     The map is the floor. Everything over it is frosted and quiet when
     idle, and becomes solid on hover or keyboard focus. */
  .furn { background: rgba(249,252,255,.58);
          -webkit-backdrop-filter: blur(7px) saturate(1.06);
          backdrop-filter: blur(7px) saturate(1.06);
          border: 1px solid rgba(202,219,235,.55); box-shadow: none;
          transition: background .14s ease, border-color .14s ease, box-shadow .14s ease; }
  .furn:hover, .furn:focus-within {
          background: rgba(255,255,255,.97); border-color: #cadbeb;
          box-shadow: 0 2px 12px rgba(16,40,61,.13); }

  /* ---------- map navigation ---------- */
  .mapnav { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); z-index: 7;
            display: flex; flex-direction: column; gap: 6px; transition: opacity .14s ease; }
  .mapnav:not(:hover):not(:focus-within) { opacity: .5; }
  .mapnav:not(:hover):not(:focus-within) button,
  .mapnav:not(:hover):not(:focus-within) .navzoom { box-shadow: none; }
  .mapnav button { width: 30px; height: 30px; display: flex; align-items: center;
                   justify-content: center; padding: 0; cursor: pointer;
                   background: rgba(255,255,255,.96); border: 1px solid var(--rule);
                   border-radius: 7px; color: var(--head); font: inherit; font-size: 16px;
                   line-height: 1; box-shadow: 0 2px 10px rgba(16,40,61,.12); }
  .mapnav button:hover:not(:disabled) { background: #fff; border-color: var(--accent);
                                        color: var(--accent); }
  .mapnav button:disabled { color: var(--ink-3); opacity: .55; cursor: default; }
  .mapnav .navfit { font-size: 13px; margin-top: 2px; }
  .mapnav .navzoom { font-size: 10.5px; color: var(--ink-3); text-align: center;
                     background: rgba(255,255,255,.96); border: 1px solid var(--rule);
                     border-radius: 7px; padding: 3px 0;
                     box-shadow: 0 2px 10px rgba(16,40,61,.12); }

  /* ---------- legend, floating bottom-left like IRT's ---------- */
  .cbar { position: absolute; left: 12px; bottom: 12px; z-index: 6;
          border-radius: 8px; padding: 7px 12px 5px; width: 268px; max-width: calc(100% - 60px); }
  /* Idle: the scale and its end values, which is the legend's whole job.
     Hover or keyboard focus brings the rest back. */
  .cbar:not(:hover):not(:focus-within) .cbar-foot { display: none; }
  .cbar-title { font-size: 12px; font-weight: 650; color: var(--head); margin-bottom: 4px; }
  .cbar-strip { position: relative; height: 13px; border-radius: 3px; border: 1px solid #cfd6dd; }
  .cbar-bracket { position: absolute; top: -5px; height: 23px; border-left: 2px solid #16202c;
                  border-right: 2px solid #16202c; pointer-events: none; }
  .cbar-ticks { position: relative; height: 16px; font-size: 11px; color: var(--ink-3); }
  .cbar-ticks span { position: absolute; transform: translateX(-50%); top: 2px; white-space: nowrap; }
  .cbar-foot { font-size: 11.5px; color: var(--ink-3); margin-top: 5px; line-height: 1.5; }
  .cbar-foot > span { display: block; }
  .swatch { display: inline-block; width: 12px; height: 12px; border: 1px solid #c3c9cf;
            border-radius: 2px; vertical-align: -2px; margin-right: 5px; }

  /* ---------- controls ---------- */
  .ctl { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
  select { font: inherit; font-size: 13px; padding: 6px 9px; border: 1px solid #c9d8e6;
           border-radius: 6px; background: #fff; color: var(--ink); max-width: 100%;
           flex: 1 1 200px; }
  select:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  button { font: inherit; font-size: 12.5px; font-weight: 600; padding: 5px 11px;
           border-radius: 6px; border: 1px solid #c9d8e6; background: #fff;
           color: var(--accent); cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
  button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent);
                                color: #fff; cursor: default; }
  .modeswitch { display: inline-flex; border: 1px solid #c9d8e6; border-radius: 6px;
                overflow: hidden; flex: none; }
  .modeswitch button { border: 0; border-radius: 0; }

  /* ---------- weight box ---------- */
  .weightbox { margin-top: 10px; padding: 11px 13px; background: var(--ground);
               border: 1px solid var(--rule); border-radius: 8px; }
  .weightbox .row { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .weightbox .wval { font-size: 26px; font-weight: 680; letter-spacing: -0.02em;
                     line-height: 1; color: var(--head); font-variant-numeric: tabular-nums; }
  .weightbox .wlab { font-size: 12.5px; color: var(--ink-2); }
  input[type=range] { width: 100%; margin: 9px 0 2px; accent-color: var(--accent); cursor: pointer; }
  .weightbox .note { font-size: 11.5px; color: var(--ink-2); line-height: 1.45; }
  .weightbox .note.drift:not(:empty) { margin-top: 7px; padding: 7px 10px; border-radius: 6px;
                                       background: var(--warn-bg); border: 1px solid var(--warn-line);
                                       color: var(--warn-ink); }

  /* ---------- evidence ---------- */
  .evidence { margin-top: 12px; background: var(--panel); border: 1px solid var(--rule);
              border-radius: 8px; padding: 12px 16px 16px; }
  .evidence > h2 { margin: 0 0 10px; font-size: 11.5px; text-transform: uppercase;
                   letter-spacing: .05em; color: var(--ink-3); font-weight: 650; }
  .stats { display: flex; flex-wrap: wrap; gap: 9px; }
  .stat { flex: 1 1 165px; background: var(--ground); border: 1px solid var(--rule);
          border-radius: 7px; padding: 9px 11px; }
  .stat .v { font-size: 21px; font-weight: 680; letter-spacing: -0.02em; color: var(--head);
             font-variant-numeric: tabular-nums; line-height: 1.1; }
  .stat .l { font-size: 11px; color: var(--ink-2); line-height: 1.4; margin-top: 3px; }

  table { border-collapse: collapse; width: 100%; margin-top: 12px; font-size: 12.5px; }
  th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--rule); }
  th { font-size: 10.5px; text-transform: uppercase; letter-spacing: .05em;
       color: var(--ink-3); font-weight: 650; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }

  .heldout { margin-top: 12px; font-size: 11.5px; color: var(--ink-2); background: var(--ground);
             border-radius: 7px; padding: 10px 13px; }
  .heldout b { color: var(--head); font-weight: 650; }
  .heldout ul { margin: 6px 0 0; padding-left: 18px; }
  .heldout code { background: #fff; border: 1px solid var(--rule); padding: 0 4px;
                  border-radius: 3px; }

  /* ---------- tooltip ---------- */
  #tip { position: fixed; pointer-events: none; z-index: 60; background: #16202c; color: #fff;
         font-size: 12px; line-height: 1.5; padding: 8px 10px; border-radius: 6px;
         max-width: 280px; opacity: 0; transition: opacity .1s ease;
         box-shadow: 0 4px 18px rgba(16,40,61,.3); }
  #tip b { display: block; font-size: 13px; margin-bottom: 3px; }
  #tip .t-row { color: #c3ced9; }
  #tip .t-row em { color: #fff; font-style: normal; font-weight: 600; }
  #tip .t-go { color: #8fc4ff; margin-top: 4px; }

  footer.meta { margin-top: 14px; font-size: 11px; color: var(--ink-3); }
</style>
</head>
<body>
<div class="wrap">

  <header class="strip">
    <h1 id="ttl">Composite weight sensitivity</h1>
    <span class="chip" id="chipScenario"></span>
    <span class="chip" id="chipLevel"></span>
    <span class="chip" id="chipRuler"></span>
    <span class="spacer"></span>
    <span class="chip parity" id="chipParity"></span>
  </header>

  <div class="panels">

    <section class="panel">
      <h2>Left &mdash; composite</h2>
      <p class="headline" id="leftTitle"></p>
      <p class="sub" id="leftSub"></p>
      <div class="mapwrap" id="wrapL">
        <svg class="map" id="mapL" preserveAspectRatio="xMidYMid meet" role="img"
             tabindex="0" aria-label="Choropleth of the composite score by district"></svg>
        <div class="mapnav" role="group" aria-label="Map navigation">
          <button type="button" class="nav-in" title="Zoom in (+)" aria-label="Zoom in">&#43;</button>
          <button type="button" class="nav-out" title="Zoom out (&minus;)" aria-label="Zoom out">&#8722;</button>
          <div class="navzoom">1.0&#215;</div>
          <button type="button" class="navfit" title="Fit India back into view (0)"
                  aria-label="Fit to view"><svg width="14" height="14" viewBox="0 0 16 16"
                  aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6"
                  stroke-linecap="round"><path d="M1.6 5.2V1.6h3.6M10.8 1.6h3.6v3.6M14.4 10.8v3.6h-3.6M5.2 14.4H1.6v-3.6"/><rect x="5.6" y="5.6" width="4.8" height="4.8" rx="1"/></svg></button>
        </div>
        <div class="cbar furn" tabindex="0">
          <div class="cbar-title" id="cbarTitleL"></div>
          <div class="cbar-strip" id="stripL"><div class="cbar-bracket" id="brL"></div></div>
          <div class="cbar-ticks" id="ticksL"></div>
          <div class="cbar-foot">
            <span><span class="swatch" id="swL"></span>Below the coverage gate</span>
            <span id="rangeL"></span>
            <span>Domain fixed 0&ndash;100 &middot; never rescaled by selection</span>
          </div>
        </div>
      </div>
    </section>

    <section class="panel">
      <h2>Right &mdash; one component metric</h2>
      <p class="headline" id="rightTitle"></p>
      <p class="sub" id="rightSub"></p>
      <div class="ctl">
        <select id="metricPick" aria-label="Component metric"></select>
        <span class="modeswitch">
          <button type="button" id="modeScore" aria-pressed="true">Ruler score</button>
          <button type="button" id="modePhys" aria-pressed="false">Physical units</button>
        </span>
      </div>
      <div class="mapwrap" id="wrapR">
        <svg class="map" id="mapR" preserveAspectRatio="xMidYMid meet" role="img"
             tabindex="0" aria-label="Choropleth of the selected component metric by district"></svg>
        <div class="mapnav" role="group" aria-label="Map navigation">
          <button type="button" class="nav-in" title="Zoom in (+)" aria-label="Zoom in">&#43;</button>
          <button type="button" class="nav-out" title="Zoom out (&minus;)" aria-label="Zoom out">&#8722;</button>
          <div class="navzoom">1.0&#215;</div>
          <button type="button" class="navfit" title="Fit India back into view (0)"
                  aria-label="Fit to view"><svg width="14" height="14" viewBox="0 0 16 16"
                  aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6"
                  stroke-linecap="round"><path d="M1.6 5.2V1.6h3.6M10.8 1.6h3.6v3.6M14.4 10.8v3.6h-3.6M5.2 14.4H1.6v-3.6"/><rect x="5.6" y="5.6" width="4.8" height="4.8" rx="1"/></svg></button>
        </div>
        <div class="cbar furn" tabindex="0">
          <div class="cbar-title" id="cbarTitleR"></div>
          <div class="cbar-strip" id="stripR"><div class="cbar-bracket" id="brR"></div></div>
          <div class="cbar-ticks" id="ticksR"></div>
          <div class="cbar-foot">
            <span><span class="swatch" id="swR"></span>No data</span>
            <span id="rangeR"></span>
            <span id="domR"></span>
          </div>
        </div>
      </div>

      <div class="weightbox">
        <div class="row">
          <span class="wval" id="wVal"></span>
          <span class="wlab" id="wLab"></span>
        </div>
        <input type="range" id="wSlide" min="0" max="0.4" step="0.001" aria-label="Weight on the selected metric">
        <div class="ctl" style="margin:6px 0 0">
          <button type="button" id="pApproved">Approved</button>
          <button type="button" id="pSolo">Solo</button>
          <button type="button" id="pZero">Drop it</button>
          <button type="button" id="pReset">Reset all</button>
        </div>
        <div class="note" id="wNote"></div>
        <div class="note drift" id="wDrift"></div>
      </div>
    </section>
  </div>

  <section class="evidence">
    <h2>What this metric does to the composite</h2>
    <div class="stats" id="stats"></div>
    <table id="moversTbl">
      <thead><tr>
        <th>Moved most vs approved weights</th><th>State</th>
        <th class="num">Approved</th><th class="num">Now</th>
        <th class="num">&Delta; score</th><th class="num">&Delta; rank</th>
      </tr></thead>
      <tbody></tbody>
    </table>
    <div class="heldout" id="heldout"></div>
  </section>

  <footer class="meta" id="meta"></footer>
</div>

<div id="tip" aria-hidden="true"></div>

<script id="payload" type="application/json">__PAYLOAD__</script>
<script>
(function () {
  "use strict";
  var D = JSON.parse(document.getElementById("payload").textContent);
  var SLUGS = D.slugs;
  var N = D.units.length;

  // ---- weights -----------------------------------------------------------
  var approved = {}, live = {};
  D.metrics.forEach(function (m) { approved[m.slug] = m.weight; live[m.slug] = m.weight; });
  var selected = SLUGS[0];
  var mode = "score";

  function liveSum() {
    var t = 0;
    SLUGS.forEach(function (s) { t += live[s]; });
    return t;
  }

  /* The coverage gate asks "was enough of the bundle actually OBSERVED here?",
     so it is measured against the weight in play, not against the configured
     headline total. At the approved weights the two are the same number
     (0.6333 x 0.70) and the published contract is reproduced exactly; they part
     company only under a hypothetical reweighting, where gating on the fixed
     0.4433 would fail every district the moment the live sum drops below it --
     Solo could never paint at all. (CHG-0531) */
  function gateWeight() { return liveSum() * D.coverage_gate; }

  // Weighted mean of ruler scores. A unit missing a metric drops that metric's
  // weight from BOTH numerator and denominator, matching weighted_row_score.
  function composite(weights) {
    var out = new Float64Array(N), cov = new Float64Array(N);
    for (var i = 0; i < N; i++) {
      var r = D.units[i].r, num = 0, den = 0;
      for (var j = 0; j < SLUGS.length; j++) {
        var v = r[j];
        if (v === null) continue;
        var w = weights[SLUGS[j]];
        num += w * v; den += w;
      }
      out[i] = den > 0 ? num / den : NaN;
      cov[i] = den;
    }
    return { score: out, weight: cov };
  }

  // ---- geometry ----------------------------------------------------------
  var BOX = { x0: 1e9, y0: 1e9, x1: -1e9, y1: -1e9 };
  var LAT0 = 22, KX = Math.cos(LAT0 * Math.PI / 180);
  function px(lon, lat) { return [lon * KX, -lat]; }

  var paths = [];
  D.units.forEach(function (u) {
    var g = D.geometry[u.k];
    if (!g) { paths.push(""); return; }
    var polys = g.t === "Polygon" ? [g.c] : g.c, d = "";
    for (var p = 0; p < polys.length; p++) {
      var rings = polys[p];
      for (var r = 0; r < rings.length; r++) {
        var ring = rings[r];
        for (var c = 0; c < ring.length; c++) {
          var q = px(ring[c][0], ring[c][1]);
          if (q[0] < BOX.x0) BOX.x0 = q[0];
          if (q[1] < BOX.y0) BOX.y0 = q[1];
          if (q[0] > BOX.x1) BOX.x1 = q[0];
          if (q[1] > BOX.y1) BOX.y1 = q[1];
          d += (c === 0 ? "M" : "L") + q[0].toFixed(4) + " " + q[1].toFixed(4);
        }
        d += "Z";
      }
    }
    paths.push(d);
  });

  var PAD = 0.15;
  var BASE = [BOX.x0 - PAD, BOX.y0 - PAD,
              (BOX.x1 - BOX.x0) + 2 * PAD, (BOX.y1 - BOX.y0) + 2 * PAD];

  function buildMap(svgId, wrapId) {
    var svg = document.getElementById(svgId);
    document.getElementById(wrapId).style.aspectRatio = (BASE[2] / BASE[3]).toFixed(4);
    svg.setAttribute("viewBox", BASE.join(" "));
    var frag = "";
    for (var i = 0; i < N; i++) {
      if (!paths[i]) continue;
      frag += '<path class="dist" data-i="' + i + '" d="' + paths[i] + '"></path>';
    }
    svg.innerHTML = frag;
    return svg;
  }
  var svgL = buildMap("mapL", "wrapL"), svgR = buildMap("mapR", "wrapR");
  var MAPS = [svgL, svgR];

  /* ---------- pan / zoom ----------
     ONE NAV state drives BOTH maps. Two independent zoom stacks would let the
     panels desync, and a composite next to a component painted at different
     extents is not a comparison. The base extent is national and fixed, so NAV
     is a transform laid over it and "fit" is always the whole country. */
  var NAV = { z: 1, ox: 0, oy: 0, drag: null, moved: false };
  var NAV_MIN = 1, NAV_MAX = 16;

  function viewBox() {
    var w = BASE[2] / NAV.z, h = BASE[3] / NAV.z;
    var mx = BASE[2] / 2, my = BASE[3] / 2;
    // pan is bounded by the base extent's own half-width: you can look past the
    // edge of the country, never lose it off-screen entirely
    if (NAV.ox > mx) NAV.ox = mx;
    if (NAV.ox < -mx) NAV.ox = -mx;
    if (NAV.oy > my) NAV.oy = my;
    if (NAV.oy < -my) NAV.oy = -my;
    return [BASE[0] + mx + NAV.ox - w / 2, BASE[1] + my + NAV.oy - h / 2, w, h];
  }

  /* preserveAspectRatio="xMidYMid meet" letterboxes the viewBox inside the
     element, so screen<->user conversion must use the FITTED scale, not the
     element width, or a drag runs away from the pointer. */
  function mapScale(vb, rect) {
    return Math.min(rect.width / vb[2], rect.height / vb[3]);
  }
  function clientToUser(svg, cx, cy) {
    var rect = svg.getBoundingClientRect(), vb = viewBox(), s = mapScale(vb, rect);
    if (!(s > 0)) return null;
    return { x: vb[0] + (cx - rect.left - (rect.width - vb[2] * s) / 2) / s,
             y: vb[1] + (cy - rect.top - (rect.height - vb[3] * s) / 2) / s };
  }

  function applyNav() {
    var vb = viewBox().join(" ");
    MAPS.forEach(function (s) { s.setAttribute("viewBox", vb); });
    var z = (Math.round(NAV.z * 10) / 10).toFixed(1) + "×";
    Array.prototype.forEach.call(document.querySelectorAll(".navzoom"), function (el) {
      el.textContent = z;
    });
    Array.prototype.forEach.call(document.querySelectorAll(".nav-in"), function (el) {
      el.disabled = NAV.z >= NAV_MAX - 1e-9;
    });
    Array.prototype.forEach.call(document.querySelectorAll(".nav-out"), function (el) {
      el.disabled = NAV.z <= NAV_MIN + 1e-9;
    });
    Array.prototype.forEach.call(document.querySelectorAll(".navfit"), function (el) {
      el.disabled = NAV.z === 1 && !NAV.ox && !NAV.oy;
    });
  }

  function navZoom(factor, pt) {
    var vb = viewBox(), z = NAV.z * factor;
    if (z > NAV_MAX) z = NAV_MAX;
    if (z < NAV_MIN) z = NAV_MIN;
    if (Math.abs(z - NAV.z) < 1e-9) return;
    var cx = vb[0] + vb[2] / 2, cy = vb[1] + vb[3] / 2, k = NAV.z / z;
    if (pt) { cx = pt.x + (cx - pt.x) * k; cy = pt.y + (cy - pt.y) * k; }  // hold the
    NAV.z = z;                                                             // pointed-at
    NAV.ox = cx - (BASE[0] + BASE[2] / 2);                                 // place still
    NAV.oy = cy - (BASE[1] + BASE[3] / 2);
    applyNav();
  }
  function navFit() { NAV.z = 1; NAV.ox = 0; NAV.oy = 0; applyNav(); }

  function wireNav(svg, wrapId) {
    var wrap = document.getElementById(wrapId);
    wrap.querySelector(".nav-in").addEventListener("click", function () { navZoom(1.5, null); });
    wrap.querySelector(".nav-out").addEventListener("click", function () { navZoom(1 / 1.5, null); });
    wrap.querySelector(".navfit").addEventListener("click", navFit);

    svg.addEventListener("wheel", function (ev) {
      ev.preventDefault();
      navZoom(ev.deltaY < 0 ? 1.18 : 1 / 1.18, clientToUser(svg, ev.clientX, ev.clientY));
    }, { passive: false });

    svg.addEventListener("pointerdown", function (ev) {
      if (ev.button !== 0) return;
      NAV.drag = { x: ev.clientX, y: ev.clientY, ox: NAV.ox, oy: NAV.oy, id: ev.pointerId };
      NAV.moved = false;
    });
    svg.addEventListener("pointermove", function (ev) {
      if (!NAV.drag) return;
      var dx = ev.clientX - NAV.drag.x, dy = ev.clientY - NAV.drag.y;
      if (!NAV.moved && Math.abs(dx) + Math.abs(dy) <= 3) return;
      if (!NAV.moved) {
        NAV.moved = true;
        if (svg.setPointerCapture) svg.setPointerCapture(NAV.drag.id);
        wrap.classList.add("panning");
      }
      var s = mapScale(viewBox(), svg.getBoundingClientRect());
      if (!(s > 0)) return;
      NAV.ox = NAV.drag.ox - dx / s;
      NAV.oy = NAV.drag.oy - dy / s;
      hideTip();
      applyNav();
    });
    function endDrag() {
      if (!NAV.drag) return;
      var id = NAV.drag.id;
      NAV.drag = null;
      wrap.classList.remove("panning");
      if (svg.hasPointerCapture && svg.hasPointerCapture(id)) svg.releasePointerCapture(id);
      if (NAV.moved) setTimeout(function () { NAV.moved = false; }, 0);
    }
    svg.addEventListener("pointerup", endDrag);
    svg.addEventListener("pointercancel", endDrag);

    svg.addEventListener("keydown", function (ev) {
      var step = viewBox()[2] * 0.15, k = ev.key;
      if (k === "+" || k === "=") { navZoom(1.5, null); ev.preventDefault(); return; }
      if (k === "-" || k === "_") { navZoom(1 / 1.5, null); ev.preventDefault(); return; }
      if (k === "0") { navFit(); ev.preventDefault(); return; }
      if (k === "ArrowLeft") NAV.ox -= step;
      else if (k === "ArrowRight") NAV.ox += step;
      else if (k === "ArrowUp") NAV.oy -= step;
      else if (k === "ArrowDown") NAV.oy += step;
      else return;
      ev.preventDefault();
      applyNav();
    });
  }
  wireNav(svgL, "wrapL"); wireNav(svgR, "wrapR");

  // ---- colour ------------------------------------------------------------
  function rulerColour(v) {
    if (v === null || !isFinite(v)) return D.missing_colour;
    var i = Math.round(Math.max(0, Math.min(100, v)));
    return D.colour_stops[i];
  }
  function physColour(v, lo, hi) {
    if (v === null || !isFinite(v) || hi <= lo) return D.missing_colour;
    var t = (v - lo) / (hi - lo);
    var i = Math.round(Math.max(0, Math.min(1, t)) * (D.physical_ramp.length - 1));
    return D.physical_ramp[i];
  }
  function rampCss(stops) { return "linear-gradient(to right," + stops.join(",") + ")"; }

  document.getElementById("stripL").style.background = rampCss(D.colour_stops);
  document.getElementById("swL").style.background = D.missing_colour;
  document.getElementById("swR").style.background = D.missing_colour;

  function paint(svg, colours) {
    var nodes = svg.childNodes;
    for (var k = 0; k < nodes.length; k++) {
      nodes[k].setAttribute("fill", colours[+nodes[k].getAttribute("data-i")]);
    }
  }

  /* The bracket exists to say "this view is narrow, not broken": it marks where
     the painted values actually sit on a ruler whose domain never moves. On the
     physical ramp the domain IS the data range, so the bracket would be the
     whole bar and is dropped. */
  function setBracket(id, lo, hi, domLo, domHi) {
    var br = document.getElementById(id);
    if (!isFinite(lo) || !isFinite(hi) || domHi <= domLo) { br.style.display = "none"; return; }
    var a = 100 * (lo - domLo) / (domHi - domLo), b = 100 * (hi - domLo) / (domHi - domLo);
    br.style.display = "";
    br.style.left = a + "%";
    br.style.width = Math.max(0.6, b - a) + "%";
  }
  function setTicks(id, values, labels) {
    var host = document.getElementById(id);
    host.innerHTML = "";
    values.forEach(function (t, k) {
      var s = document.createElement("span");
      s.textContent = labels[k];
      s.style.left = t + "%";
      host.appendChild(s);
    });
  }

  // ---- stats -------------------------------------------------------------
  function ranks(arr) {
    var idx = [];
    for (var i = 0; i < arr.length; i++) if (isFinite(arr[i])) idx.push(i);
    idx.sort(function (a, b) { return arr[b] - arr[a]; });
    var out = new Float64Array(arr.length); out.fill(NaN);
    var i2 = 0;
    while (i2 < idx.length) {
      var j = i2;
      while (j + 1 < idx.length && arr[idx[j + 1]] === arr[idx[i2]]) j++;
      var mid = (i2 + j) / 2 + 1;
      for (var k = i2; k <= j; k++) out[idx[k]] = mid;
      i2 = j + 1;
    }
    return out;
  }
  function spearman(a, b) {
    var ra = ranks(a), rb = ranks(b), xs = [], ys = [];
    for (var i = 0; i < ra.length; i++) {
      if (isFinite(ra[i]) && isFinite(rb[i])) { xs.push(ra[i]); ys.push(rb[i]); }
    }
    var n = xs.length; if (n < 3) return NaN;
    var mx = 0, my = 0, i2;
    for (i2 = 0; i2 < n; i2++) { mx += xs[i2]; my += ys[i2]; }
    mx /= n; my /= n;
    var sxy = 0, sxx = 0, syy = 0;
    for (i2 = 0; i2 < n; i2++) {
      var dx = xs[i2] - mx, dy = ys[i2] - my;
      sxy += dx * dy; sxx += dx * dx; syy += dy * dy;
    }
    return (sxx > 0 && syy > 0) ? sxy / Math.sqrt(sxx * syy) : NaN;
  }
  function topOverlap(a, b, k) {
    function top(arr) {
      var idx = [];
      for (var i = 0; i < arr.length; i++) if (isFinite(arr[i])) idx.push(i);
      idx.sort(function (x, y) { return arr[y] - arr[x]; });
      return idx.slice(0, k);
    }
    var A = top(a), B = {}, hit = 0;
    top(b).forEach(function (i) { B[i] = 1; });
    A.forEach(function (i) { if (B[i]) hit++; });
    return hit;
  }

  // ---- render ------------------------------------------------------------
  var base = composite(approved), baseRank = ranks(base.score), cur = base;

  function fmt(v, dp) { return (v === null || !isFinite(v)) ? "—" : v.toFixed(dp); }
  function esc(s) {
    return String(s).replace(/[&<>]/g, function (c) {
      return c === "&" ? "&amp;" : c === "<" ? "&lt;" : "&gt;";
    });
  }
  function metricOf(slug) {
    for (var i = 0; i < D.metrics.length; i++) if (D.metrics[i].slug === slug) return D.metrics[i];
    return null;
  }

  var TICK_AT = [0, 20, 40, 60, 80, 100];
  var rightVals = [], rightLo = NaN, rightHi = NaN;

  function render() {
    cur = composite(live);
    var gateW = gateWeight();
    var colsL = [], i, lo = Infinity, hi = -Infinity, painted = 0;
    for (i = 0; i < N; i++) {
      var ok = cur.weight[i] >= gateW && isFinite(cur.score[i]);
      colsL.push(ok ? rulerColour(cur.score[i]) : D.missing_colour);
      if (ok) {
        painted++;
        if (cur.score[i] < lo) lo = cur.score[i];
        if (cur.score[i] > hi) hi = cur.score[i];
      }
    }
    paint(svgL, colsL);

    document.getElementById("cbarTitleL").textContent = D.composite_label + " · hazard score";
    setTicks("ticksL", TICK_AT, TICK_AT.map(String));
    setBracket("brL", lo, hi, 0, 100);
    document.getElementById("rangeL").textContent = painted
      ? "Range in view " + fmt(lo, 1) + "–" + fmt(hi, 1) +
        " · " + fmt(hi - lo, 1) + " wide"
      : "";

    var j = SLUGS.indexOf(selected), m = metricOf(selected);
    var colsR = [], rlo = Infinity, rhi = -Infinity;
    rightVals = [];
    for (i = 0; i < N; i++) {
      var v = mode === "score" ? D.units[i].r[j] : D.units[i].v[j];
      rightVals.push(v);
      if (v !== null && isFinite(v)) { if (v < rlo) rlo = v; if (v > rhi) rhi = v; }
    }
    rightLo = rlo; rightHi = rhi;
    for (i = 0; i < N; i++) {
      colsR.push(mode === "score" ? rulerColour(rightVals[i]) : physColour(rightVals[i], rlo, rhi));
    }
    paint(svgR, colsR);

    var stripR = document.getElementById("stripR");
    if (mode === "score") {
      stripR.style.background = rampCss(D.colour_stops);
      document.getElementById("cbarTitleR").textContent = m.label + " · ruler score";
      setTicks("ticksR", TICK_AT, TICK_AT.map(String));
      setBracket("brR", rlo, rhi, 0, 100);
      document.getElementById("rangeR").textContent = isFinite(rlo)
        ? "Range in view " + fmt(rlo, 1) + "–" + fmt(rhi, 1) +
          " · " + fmt(rhi - rlo, 1) + " wide"
        : "";
      document.getElementById("domR").textContent =
        "Domain fixed 0–100 · the number the weight multiplies";
    } else {
      stripR.style.background = rampCss(D.physical_ramp);
      document.getElementById("cbarTitleR").textContent =
        m.label + (m.units ? " · " + m.units : "");
      setTicks("ticksR", [0, 50, 100],
        [fmt(rlo, 1), fmt((rlo + rhi) / 2, 1), fmt(rhi, 1)]);
      setBracket("brR", NaN, NaN, 0, 100);
      document.getElementById("rangeR").textContent =
        isFinite(rlo) ? "Linear over the national range" : "";
      document.getElementById("domR").textContent =
        "Its own ramp — the published colourbar forbids rescaling";
    }

    document.getElementById("rightTitle").textContent = m.label;
    document.getElementById("rightSub").textContent =
      m.group + " · configured weight " + approved[selected].toFixed(4) +
      " of " + D.configured_weight.toFixed(4);

    // weight readout
    var sum = liveSum(), drift = sum - D.configured_weight;
    document.getElementById("wVal").textContent = live[selected].toFixed(3);
    document.getElementById("wLab").textContent =
      "weight on " + m.label + "  (approved " + approved[selected].toFixed(3) + ")";
    document.getElementById("wSlide").value = live[selected];
    var nonZero = 0;
    SLUGS.forEach(function (s) { if (live[s] > 0) nonZero++; });
    document.getElementById("wNote").textContent =
      "Share of the live composite: " + (100 * live[selected] / (sum || 1)).toFixed(1) +
      "%. The other " + (SLUGS.length - 1) +
      " weights are untouched; the denominator is the live sum." +
      (nonZero === 1 && live[selected] > 0
        ? "  Only this metric carries weight, so the composite reduces to w·s / w = s"
          + " — the two maps are now the same map."
        : "");
    document.getElementById("wDrift").textContent = Math.abs(drift) < 1e-9 ? "" :
      "Headline weight " + D.configured_weight.toFixed(3) + " → " + sum.toFixed(3) +
      ". This is a hypothetical bundle, not the published one. The " +
      D.coverage_gate.toFixed(2) + " coverage gate follows the live sum (a district must have " +
      "observed " + (100 * D.coverage_gate).toFixed(0) + "% of the weight in play), so districts " +
      "near the gate can change state.";

    // stats
    var mScores = [];
    for (i = 0; i < N; i++) mScores.push(D.units[i].r[j]);
    var rhoMetric = spearman(mScores, Array.prototype.slice.call(cur.score));
    var rhoChurn = spearman(Array.prototype.slice.call(base.score),
                            Array.prototype.slice.call(cur.score));
    var ovl = topOverlap(Array.prototype.slice.call(base.score),
                         Array.prototype.slice.call(cur.score), 50);
    var curRank = ranks(cur.score), maxShift = 0, maxDelta = 0;
    for (i = 0; i < N; i++) {
      if (isFinite(curRank[i]) && isFinite(baseRank[i])) {
        maxShift = Math.max(maxShift, Math.abs(curRank[i] - baseRank[i]));
      }
      if (isFinite(cur.score[i]) && isFinite(base.score[i])) {
        maxDelta = Math.max(maxDelta, Math.abs(cur.score[i] - base.score[i]));
      }
    }
    var gated = 0;
    for (i = 0; i < N; i++) if (cur.weight[i] < gateW) gated++;

    document.getElementById("stats").innerHTML = [
      stat(fmt(rhoMetric, 3), "Spearman &rho; of this metric alone against the live composite &mdash; how much of the ranking it already explains"),
      stat(fmt(rhoChurn, 4), "Spearman &rho; of the live composite against the approved-weight composite"),
      stat(ovl + " / 50", "Top-50 districts still in the top 50 after the reweighting"),
      stat(Math.round(maxShift), "Largest rank shift, of " + N + " districts"),
      stat(fmt(maxDelta, 2), "Largest score change, on the 0&ndash;100 ruler"),
      stat(gated, "Districts below the coverage gate")
    ].join("");

    // movers
    var rows = [];
    for (i = 0; i < N; i++) {
      if (!isFinite(cur.score[i]) || !isFinite(base.score[i])) continue;
      rows.push({ i: i, d: cur.score[i] - base.score[i] });
    }
    rows.sort(function (a, b) { return Math.abs(b.d) - Math.abs(a.d); });
    var body = "";
    rows.slice(0, 12).forEach(function (r) {
      var u = D.units[r.i];
      body += "<tr><td>" + esc(u.n) + "</td><td>" + esc(u.s) + "</td>" +
        '<td class="num">' + fmt(base.score[r.i], 1) + "</td>" +
        '<td class="num">' + fmt(cur.score[r.i], 1) + "</td>" +
        '<td class="num">' + (r.d >= 0 ? "+" : "") + r.d.toFixed(2) + "</td>" +
        '<td class="num">' + (isFinite(curRank[r.i]) && isFinite(baseRank[r.i])
          ? (baseRank[r.i] - curRank[r.i] >= 0 ? "+" : "") +
            (baseRank[r.i] - curRank[r.i]).toFixed(0) : "—") + "</td></tr>";
    });
    document.querySelector("#moversTbl tbody").innerHTML =
      body || '<tr><td colspan="6">Weights are at their approved values &mdash; nothing has moved.</td></tr>';
  }

  function stat(v, l) {
    return '<div class="stat"><div class="v">' + v + '</div><div class="l">' + l + "</div></div>";
  }

  // ---- chrome ------------------------------------------------------------
  document.getElementById("ttl").textContent =
    D.composite_label + " — what each metric contributes";
  document.getElementById("chipScenario").textContent = D.scenario + " · " + D.period;
  document.getElementById("chipLevel").textContent = N + " " + D.level + "s";
  document.getElementById("chipRuler").textContent = D.ruler_id;
  document.getElementById("chipParity").textContent = D.parity.checked
    ? "matches published composite to " + D.parity.max_abs_diff.toFixed(4) + " pts (n=" + D.parity.n + ")"
    : "published composite not available for parity check";
  document.getElementById("leftTitle").textContent = D.composite_label;
  document.getElementById("leftSub").textContent =
    "Recomputed live as Σwᵢ·sᵢ / Σwᵢ over " +
    SLUGS.length + " headline metrics, each scored through its frozen national ruler.";

  var pick = document.getElementById("metricPick");
  pick.innerHTML = D.metrics.map(function (m) {
    return '<option value="' + m.slug + '">' + esc(m.label) + "  — " + esc(m.group) + "</option>";
  }).join("") + D.held_out.map(function (m) {
    return "<option disabled>" + esc(m.label) + "  — held out of the headline</option>";
  }).join("");

  document.getElementById("heldout").innerHTML =
    "<b>Held out of the headline by design (CHG-0367b).</b> " + D.held_out.length +
    " baseline-referenced metrics carry weight in the bundle but not in the published score, " +
    "because the frozen national ruler publishes the absolute half only. The headline denominator is " +
    D.configured_weight.toFixed(4) + ", not 1.0." +
    "<ul>" + D.held_out.map(function (m) {
      return "<li><code>" + esc(m.slug) + "</code> &mdash; " + esc(m.label) +
        " (configured weight " + m.weight.toFixed(4) + ")</li>";
    }).join("") + "</ul>";

  document.getElementById("meta").textContent =
    "Bundle " + D.bundle + " · composite " + D.composite_slug +
    " · ruler " + D.ruler_id + " (" + D.ruler_version + ")" +
    " · coverage gate " + D.coverage_gate +
    " · geometry simplified for display · diagnostic artifact, not a published map.";

  // ---- interaction -------------------------------------------------------
  pick.addEventListener("change", function () { selected = pick.value; render(); });

  var slide = document.getElementById("wSlide");
  slide.addEventListener("input", function () {
    live[selected] = parseFloat(slide.value);
    render();
  });

  document.getElementById("pApproved").addEventListener("click", function () {
    live[selected] = approved[selected]; render();
  });
  document.getElementById("pSolo").addEventListener("click", function () {
    SLUGS.forEach(function (s) { live[s] = (s === selected) ? approved[s] : 0; });
    render();
  });
  document.getElementById("pZero").addEventListener("click", function () {
    live[selected] = 0; render();
  });
  document.getElementById("pReset").addEventListener("click", function () {
    SLUGS.forEach(function (s) { live[s] = approved[s]; });
    render();
  });

  function setMode(m) {
    mode = m;
    document.getElementById("modeScore").setAttribute("aria-pressed", String(m === "score"));
    document.getElementById("modePhys").setAttribute("aria-pressed", String(m === "phys"));
    render();
  }
  document.getElementById("modeScore").addEventListener("click", function () { setMode("score"); });
  document.getElementById("modePhys").addEventListener("click", function () { setMode("phys"); });

  // ---- tooltip -----------------------------------------------------------
  /* Hover highlights the SAME district in both panels: the page exists to say
     that this unit's colour on the left is made of its colour on the right. */
  var tip = document.getElementById("tip");
  var hot = -1;

  function highlight(i) {
    if (hot === i) return;
    if (hot >= 0) MAPS.forEach(function (s) {
      var n = s.querySelector('[data-i="' + hot + '"]');
      if (n) n.classList.remove("hl");
    });
    hot = i;
    if (hot >= 0) MAPS.forEach(function (s) {
      var n = s.querySelector('[data-i="' + hot + '"]');
      if (n) n.classList.add("hl");
    });
  }
  function hideTip() {
    tip.style.opacity = "0";
    tip.setAttribute("aria-hidden", "true");
    highlight(-1);
  }
  function showTip(html, ev) {
    tip.innerHTML = html;
    tip.style.opacity = "1";
    tip.setAttribute("aria-hidden", "false");
    var x = ev.clientX + 16, y = ev.clientY + 16;
    var r = tip.getBoundingClientRect();
    if (x + r.width > window.innerWidth - 10) x = ev.clientX - r.width - 16;
    if (y + r.height > window.innerHeight - 10) y = ev.clientY - r.height - 16;
    tip.style.left = x + "px";
    tip.style.top = y + "px";
  }

  function hookTip(svg) {
    svg.addEventListener("mousemove", function (ev) {
      if (NAV.drag && NAV.moved) { hideTip(); return; }
      var t = ev.target;
      if (t.tagName !== "path") { hideTip(); return; }
      var i = +t.getAttribute("data-i"), u = D.units[i], j = SLUGS.indexOf(selected);
      var m = metricOf(selected);
      highlight(i);
      var gated = cur.weight[i] < gateWeight();
      var html = "<b>" + esc(u.n) + "</b>" +
        "<div class='t-row'>" + esc(u.s) + "</div>" +
        "<div class='t-row'>" + esc(D.composite_label) + " <em>" +
          (gated ? "—" : fmt(cur.score[i], 1)) + "</em>" +
          (gated ? " · below the coverage gate" : "") + "</div>" +
        "<div class='t-row'>" + esc(m.label) + " <em>" + fmt(u.r[j], 1) + "</em> on the ruler";
      if (u.v[j] !== null) {
        html += " · <em>" + fmt(u.v[j], 2) + "</em>" + (m.units ? " " + esc(m.units) : "");
      }
      html += "</div><div class='t-row t-go'>Weight " + live[selected].toFixed(3) +
        " of " + liveSum().toFixed(3) + " live</div>";
      showTip(html, ev);
    });
    svg.addEventListener("mouseleave", hideTip);
  }
  hookTip(svgL); hookTip(svgR);

  // slider ceiling: a little headroom above the largest approved weight
  var maxApproved = 0;
  SLUGS.forEach(function (s) { maxApproved = Math.max(maxApproved, approved[s]); });
  slide.max = Math.max(0.4, Math.ceil(maxApproved * 40) / 10);

  pick.value = selected;
  applyNav();
  render();
})();
</script>
</body>
</html>
