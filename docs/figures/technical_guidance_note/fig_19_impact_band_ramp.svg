<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="468.1" viewBox="0 128.5 1200 468.1" role="img" aria-labelledby="title desc">
<title id="title">FIG-19. Impact-band ramp</title>
<desc id="desc">Impact lens ramp schematic.</desc>
<style>
text { font-family: Arial, Helvetica, sans-serif; fill: #1f2933; }
.title { font-size: 26px; font-weight: 700; }
.subtitle { font-size: 15px; fill: #52606d; }
.label { font-size: 15px; font-weight: 700; }
.small { font-size: 12px; fill: #52606d; }
.tiny { font-size: 10.5px; fill: #52606d; }
.note { font-size: 12px; fill: #3e4c59; font-style: italic; }
.axis { stroke: #52606d; stroke-width: 1.2; }
.gridline { stroke: #d9e2ec; stroke-width: 1; }
.arrow { stroke: #52606d; stroke-width: 2.0; fill: none; marker-end: url(#arrow); }
</style>
<defs>
<marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
<path d="M 1 1 L 11 6 L 1 11 z" fill="#52606d"/>
</marker>
</defs>
<rect x="0" y="128.5" width="1200" height="468.1" fill="white" data-bg="canvas"/>
<rect x="150" y="145" width="860" height="410" fill="#f8fafc" stroke="#d9e2ec"/>
<rect x="210" y="180" width="253.33333333333334" height="320" fill="#eef3f8" opacity="0.55"/>
<rect x="463.3333333333333" y="180" width="253.33333333333331" height="320" fill="#fff2cc" opacity="0.48"/>
<rect x="716.6666666666666" y="180" width="253.33333333333331" height="320" fill="#fde2e7" opacity="0.42"/>
<line x1="210" y1="500" x2="970" y2="500" stroke="#52606d" stroke-width="1.3"/>
<line x1="210" y1="180" x2="210" y2="500" stroke="#52606d" stroke-width="1.3"/>
<line x1="210" y1="500.0" x2="970" y2="500.0" stroke="#d9e2ec" stroke-width="0.8"/>
<text x="200.0" y="504.0" class="tiny" text-anchor="end">0</text>
<line x1="210" y1="422.5" x2="970" y2="422.5" stroke="#d9e2ec" stroke-width="0.8"/>
<text x="200.0" y="426.5" class="tiny" text-anchor="end">25</text>
<line x1="210" y1="345.0" x2="970" y2="345.0" stroke="#d9e2ec" stroke-width="0.8"/>
<text x="200.0" y="349.0" class="tiny" text-anchor="end">50</text>
<line x1="210" y1="267.5" x2="970" y2="267.5" stroke="#d9e2ec" stroke-width="0.8"/>
<text x="200.0" y="271.5" class="tiny" text-anchor="end">75</text>
<line x1="210" y1="190.0" x2="970" y2="190.0" stroke="#d9e2ec" stroke-width="0.8"/>
<text x="200.0" y="194.0" class="tiny" text-anchor="end">100</text>
<polyline points="210.0,500.0 463.3,500.0 716.7,190.0 970.0,190.0" fill="none" stroke="#b8324f" stroke-width="4.0" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="463.3333333333333" y1="500.0" x2="463.3333333333333" y2="190.0" stroke="#c77700" stroke-width="1.8" stroke-dasharray="6 5"/>
<line x1="716.6666666666666" y1="500.0" x2="716.6666666666666" y2="190.0" stroke="#c77700" stroke-width="1.8" stroke-dasharray="6 5"/>
<text x="463.3" y="529.0" class="small" text-anchor="middle">onset a = 40 °C</text>
<text x="716.7" y="529.0" class="small" text-anchor="middle">saturation b = 45 °C</text>
<text x="580.0" y="577.0" class="small" text-anchor="middle">raw metric value v: TXx (°C)</text>
<text x="168.0" y="350.0" class="small" text-anchor="middle" transform="rotate(-90 168 350.0)">impact score S_imp</text>
<rect x="700" y="200" width="330" height="88" rx="5" fill="#fff8e6" stroke="#c77700" stroke-width="1.8" class="flow-box"/>
<text x="865.0" y="226.0" class="label" text-anchor="middle" data-box="700,200,330,88">Formula</text>
<g class="math-label" data-math-tex="S_{\mathrm{imp}}=\mathrm{clip}\left(\frac{v-a}{b-a},0,1\right)\times100" data-math-x="865" data-math-y="252" data-math-anchor="middle" data-math-size="12" data-math-display="0"><text x="865.0" y="252.0" class="small" text-anchor="middle">S_imp = clip((v - a)/(b - a), 0, 1) x 100</text></g>
<text x="520.0" y="305.0" class="label" text-anchor="middle">linear ramp</text>
<text x="268.0" y="512.0" class="small" text-anchor="middle">score = 0</text>
<text x="920.0" y="162.0" class="small" text-anchor="middle">score = 100</text>
</svg>
