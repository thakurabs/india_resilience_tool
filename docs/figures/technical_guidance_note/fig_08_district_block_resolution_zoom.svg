<text x="965.0" y="332.0" class="label" text-anchor="middle">48</text>
<text x="660.0" y="600.0" class="tiny" text-anchor="start">Number in each block = its composite score (0-100).</text>
<text x="660.0" y="620.0" class="small" text-anchor="start">Three blocks inside one cell all take that cell's value (62); the</text>
<text x="660.0" y="638.0" class="small" text-anchor="start">adjacent cell can differ (48). Block scores cannot resolve</text>
<text x="660.0" y="654.0" class="small" text-anchor="start">contrast finer than the ~25 km cell.</text>
