<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="594.5" viewBox="0 79.1 1200 594.5" role="img" aria-labelledby="title desc">
<title id="title">FIG-08. District/block resolution zoom</title>
<desc id="desc">Illustrative resolution contrast.</desc>
